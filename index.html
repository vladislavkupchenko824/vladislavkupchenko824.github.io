<style>
  :root {
    --bg: #14161f;
    --card: #1e2130;
    --card-hover: #272b40;
    --text: #f1f2f7;
    --muted: #9aa0b8;
    --accent: #0f5f2e;      /* ✏️ зелёный: кнопка почты и обводка аватара */
    --btn: #2b95d6;         /* ✏️ цвет кнопок */
    --btn-hover: #4fb0ea;   /* цвет кнопки при наведении */
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f4f9; --card:#ffffff; --card-hover:#e9eaf3; --text:#1a1c28; --muted:#5d6280; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex; justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 460px; text-align: center; }
  .avatar {
    width: 200px; height: 200px; border-radius: 50%;
    object-fit: cover; display: block; margin: 0 auto 20px;
    border: 3px solid var(--accent);
    background: var(--card);
  }
  h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: .01em; }
  .about { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  .mail {
    display: block; padding: 14px 18px; margin-bottom: 28px;
    background: var(--accent); color: #fff; text-decoration: none;
    border-radius: 12px; font-weight: 600;
  }
  .mail:hover { filter: brightness(1.1); }
  .links { display: flex; flex-direction: column; gap: 10px; }
  .links a {
    display: block; padding: 14px 18px;
    background: var(--btn); color: #06263d; text-decoration: none;
    border-radius: 12px;
    transition: background .15s;
  }
  .links a:hover { background: var(--btn-hover); }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button {
    flex: 1; padding: 12px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--btn); color: #0b3a5c; font: inherit; font-weight: 600;
  }
  .tabs button[aria-selected="true"] { background: var(--btn-hover); color: #06263d; box-shadow: inset 0 -3px 0 var(--accent); }
  [hidden] { display: none !important; }
  .books { text-align: left; }
  .books input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 12px;
    border: 1px solid var(--card-hover); background: var(--card); color: var(--text); font: inherit;
  }
  .books ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .books li { padding: 12px 16px; background: var(--btn); color: #06263d; border-radius: 12px; line-height: 1.4; }
  .books .count, .books .empty { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.6); font-size: .9rem; margin: 0 0 10px; }

  const booksText = `

2.Алмазный огранщик — Геше Майкл Роуч (аудио)
3.Как стать бизнесменом — О. Ю. Тиньков

7.Mamba Mentality — Коби Брайант 824
8.Сделано в Японии — Акио Морита
9.Сделано в Америке — Сэм Уолтон
10.Стив Джобс — Уолтер Айзексон
11.Искусство войны — Сунь-цзы
12.Тридцать шесть стратагем — китайский трактат
13.Психолог в концлагере — Виктор Франкл
14.Скажи жизни «Да» — Виктор Франкл
15.Меня не сломать — Дэвид Гоггинс
16.Книги Карлоса Кастанеды — Карлос Кастанеда
17.Питание и физическое вырождение — Уэстон Прайс
18.Соль, сахар и жир. Как пищевые гиганты посадили нас на иглу — Майкл Мосс
19.Modern from the Start — Alexander Calder
20.Теряя невинность / Обнажённый бизнес — Ричард Брэнсон
21.Преступление и наказание — Ф. М. Достоевский
22.Почему мы спим — Мэттью Уокер
23.Безслизистая диета — Арнольд Эрет
24.Lagom. Секрет шведского благополучия
25.Есть идея! История ИКЕА - Ингвар Кампрад
update 30/09/26
`;

  const books = booksText.split("\n").map(s => s.trim()).filter(Boolean);
  const list = document.getElementById("book-list");
  const count = document.getElementById("count");
  const search = document.getElementById("search");

  function render(filter = "") {
    const q = filter.trim().toLowerCase();
    const shown = books.filter(b => b.toLowerCase().includes(q));
    list.innerHTML = "";
    shown.forEach(b => {
      const li = document.createElement("li");
      li.textContent = b;
      list.appendChild(li);
    });
    count.textContent = shown.length
      ? "Книг: " + shown.length
      : "Ничего не найдено";
  }
  search.addEventListener("input", e => render(e.target.value));
  render();

  // Переключение вкладок
  const tabs = { links: ["btn-links", "tab-links"], books: ["btn-books", "tab-books"] };
  function show(name) {
    for (const key in tabs) {
      const [btn, panel] = tabs[key];
      document.getElementById(btn).setAttribute("aria-selected", key === name);
      document.getElementById(panel).hidden = key !== name;
    }
    history.replaceState(null, "", name === "books" ? "#books" : location.pathname);
  }
  document.getElementById("btn-links").onclick = () => show("links");
  document.getElementById("btn-books").onclick = () => show("books");
  if (location.hash === "#books") show("books");

  // Копирование адреса почты
  const copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", async () => {
    const email = "tibet.18@mail.ru";
    let ok = false;
    try { await navigator.clipboard.writeText(email); ok = true; }
    catch (e) {
      const t = document.createElement("textarea");
      t.value = email; document.body.appendChild(t); t.select();
      try { ok = document.execCommand("copy"); } catch (e2) {}
      t.remove();
    }
    copyBtn.textContent = ok ? "Скопировано ✓" : email;
    setTimeout(() => (copyBtn.textContent = "Копировать"), 2500);
  });
</script>
